name: hirfigyelo

on:
  schedule:
    - cron: "*/15 * * * *"
    # sűrűbb ébresztés reggel (UTC 5-6 óra = 7:00 körül Budapesten), hogy a naptár legkésőbb 7:30-ra odaérjen
    - cron: "*/5 5-6 * * *"
    # sűrűbb ébresztés az amerikai adatközlések idején (actual-értékek gyors elküldéséhez)
    - cron: "*/5 12-15 * * 1-5"
  workflow_dispatch:
    inputs:
      teszt:
        description: "Csak tesztértesítést küld a TESZT-címzettnek (a híreket nem ellenőrzi, a felhasználók nem kapnak semmit)"
        type: boolean
        default: false
      kozlemeny:
        description: "Közlemény szövege (ha kitöltöd, csak ezt küldi ki, a híreket nem ellenőrzi)"
        type: string
        default: ""
      kozlemeny_cimzett:
        description: "Közlemény címzettje: eloszor 'teszt' (csak neked), utána 'mindenki'"
        type: choice
        options:
          - teszt
          - mindenki
        default: teszt
      naptar:
        description: "A mai piros mappás EUR/USD naptárat azonnal elküldi a TESZT-címzettnek (a híreket nem ellenőrzi)"
        type: boolean
        default: false
      heti:
        description: "A következő hét előnézetét azonnal elküldi a TESZT-címzettnek (a híreket nem ellenőrzi)"
        type: boolean
        default: false
      ar:
        description: "Az összes figyelt eszköz (arany, olaj, ezüst, blue chipek stb.) aktuális állása a TESZT-címzettnek, a jelek ellenőrzéséhez (a híreket nem ellenőrzi)"
        type: boolean
        default: false
      ffoldal:
        description: "Próba: eléri-e a futtató a Forex Factory weboldalát, és látszanak-e az actual-értékek (a híreket nem ellenőrzi)"
        type: boolean
        default: false
      stat:
        description: "Az eddig összegyűjtött heti statisztikát a TESZT-címzettnek küldi (nullázás nélkül; a híreket nem ellenőrzi)"
        type: boolean
        default: false
      admin:
        description: "Próba-üzenet a működésfigyelő csatornára (a TESZT-címzettnek)"
        type: boolean
        default: false
      diag:
        description: "Telegram-diagnózis is (csak ha a tesztelés közben a Telegram nem válaszol; terheli a botot)"
        type: boolean
        default: false

permissions:
  contents: write

# egyszerre csak egy futás mehet, így nem ütköznek a mentések
concurrency:
  group: hirfigyelo
  cancel-in-progress: false

jobs:
  figyel:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      TZ: Europe/Budapest
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_API_URL: ${{ secrets.TELEGRAM_API_URL }}
      # teszt-címzett: ide mennek a tesztek és a közlemény-előnézetek (nem a felhasználókhoz)
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
      NTFY_TEST_TOPIC: ${{ secrets.NTFY_TEST_TOPIC }}
      # a beírt szöveget környezeti változón át adjuk át, nem a parancssorba illesztve
      KOZLEMENY: ${{ github.event.inputs.kozlemeny }}
      KOZLEMENY_CIMZETT: ${{ github.event.inputs.kozlemeny_cimzett }}
    steps:
      - uses: actions/checkout@v4

      - name: Tesztértesítés
        if: github.event.inputs.teszt == 'true'
        timeout-minutes: 2
        run: python3 hirfigyelo.py --test

      - name: Közlemény
        if: github.event.inputs.kozlemeny != ''
        timeout-minutes: 2
        run: |
          if [ "$KOZLEMENY_CIMZETT" = "mindenki" ]; then
            python3 hirfigyelo.py --kozlemeny "$KOZLEMENY"
          else
            python3 hirfigyelo.py --kozlemeny "$KOZLEMENY" --teszt-cimzett
          fi

      - name: Naptár (teszt)
        if: github.event.inputs.naptar == 'true'
        timeout-minutes: 2
        run: python3 hirfigyelo.py --naptar --teszt-cimzett

      - name: Heti előnézet (teszt)
        if: github.event.inputs.heti == 'true'
        timeout-minutes: 2
        run: python3 hirfigyelo.py --heti --teszt-cimzett

      - name: Árfigyelés teszt
        if: github.event.inputs.ar == 'true'
        timeout-minutes: 2
        run: python3 hirfigyelo.py --ar-teszt

      - name: Forex Factory oldal próba
        if: github.event.inputs.ffoldal == 'true'
        continue-on-error: true
        timeout-minutes: 2
        run: python3 hirfigyelo.py --ff-oldal-teszt

      - name: Statisztika (teszt)
        if: github.event.inputs.stat == 'true'
        timeout-minutes: 2
        run: python3 hirfigyelo.py --stat

      - name: Admin próba
        if: github.event.inputs.admin == 'true'
        timeout-minutes: 2
        run: python3 hirfigyelo.py --admin-teszt

      - name: Telegram diagnózis
        if: github.event.inputs.diag == 'true'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          sleep 30  # hagyjuk lecsengeni a korlátozást az előző lépés után
          python3 hirfigyelo.py --telegram-diag
          echo "--- curl próba ---"
          API="${TELEGRAM_API_URL:-https://api.telegram.org}"
          curl -sS -m 20 -o /dev/null -w "curl getMe: HTTP %{http_code}, %{time_total} mp\n" -A "Mozilla/5.0" "${API%/}/bot${TELEGRAM_BOT_TOKEN}/getMe" || echo "curl hiba"

      - name: Hírek ellenőrzése
        if: github.event.inputs.teszt != 'true' && github.event.inputs.kozlemeny == '' && github.event.inputs.naptar != 'true' && github.event.inputs.heti != 'true' && github.event.inputs.ar != 'true' && github.event.inputs.stat != 'true' && github.event.inputs.ffoldal != 'true' && github.event.inputs.admin != 'true'
        timeout-minutes: 12
        run: python3 hirfigyelo.py

      # always(): az állapot akkor is mentődik, ha az előző lépés hibával vagy időtúllépéssel állt le,
      # így a már elküldött hírek nem mennek ki újra
      - name: Eredmények mentése
        if: always()
        run: |
          git config user.name "hirfigyelo"
          git config user.email "hirfigyelo@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "allapot"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main
          done
          exit 1
