name: hirfigyelo

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      teszt:
        description: "Csak tesztértesítést küld (a híreket nem ellenőrzi)"
        type: boolean
        default: false

permissions:
  contents: write

# egyszerre csak egy futás mehet, így nem ütköznek a mentések
concurrency:
  group: hirfigyelo
  cancel-in-progress: false

jobs:
  figyel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Europe/Budapest
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Tesztértesítés
        if: github.event.inputs.teszt == 'true'
        timeout-minutes: 2
        run: python3 hirfigyelo.py --test

      - name: Hírek ellenőrzése
        if: github.event.inputs.teszt != 'true'
        timeout-minutes: 4
        run: python3 hirfigyelo.py

      # always(): az állapot akkor is mentődik, ha az előző lépés hibával vagy időtúllépéssel állt le,
      # így a már elküldött hírek nem mennek ki újra
      - name: Eredmények mentése
        if: always()
        run: |
          git config user.name "hirfigyelo"
          git config user.email "hirfigyelo@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "allapot"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main
          done
          exit 1
